<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f9fa">
    <title>Article — alexore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      .article-wrap {
        width:min(760px,calc(100% - 40px));
        margin:30px auto 110px
      }
      .article-back {
        font-size:11px;
        border-bottom:1px solid #a6bdc2;
        padding-bottom:8px
      }
      .article-sample-note {
        margin:23px 0 18px;
        font:8px var(--mono);
        letter-spacing:.12em;
        color:#72878c
      }
      .article-hero {
        margin:0 0 35px;
        padding:40px;
        background:#d9eef3;
        min-height:180px;
        position:relative;
        overflow:hidden
      }

      .article-meta {
        font:9px var(--mono);
        letter-spacing:.1em;
        color:#68797e
      }
      .article-wrap h1 {
        font:500 clamp(42px,7vw,68px)/1.08 var(--serif);
        letter-spacing:-.04em;
        margin:23px 0
      }
      .article-deck {
        position:relative;
        max-width:690px;
        margin:26px 0 34px;
        padding:20px 25px 22px;
        background: #eaf0f6;
        border-left: 2px solid #6e96ce;
        color:#68797e;
        font:italic clamp(16px, 1rem + .3vw, 18px)/1.55 var(--serif)
      }
      .article-deck:before {
        content:"THE ESSENCE";
        display:block;
        margin:0 0 10px;
        color:#68797e;
        font:8px var(--mono);
        font-style:normal;
        letter-spacing:.16em
      }
      .article-body>p:first-child {
        margin-top:0
      }
      @media(max-width:600px) {
        .article-deck {
          margin:20px 0 27px;
          padding:17px 16px 18px;
          font-size:clamp(15.5px, 4vw, 17px);
          line-height:1.5
        }
        .article-deck:before {
          margin-bottom:8px
        }
      }
      .article-body {
        font:16px/1.9 var(--sans);
        color:#34454a
      }
      .article-body h2 {
        font:500 29px/1.2 var(--serif);
        margin:2em 0 .6em
      }
      .article-body blockquote {
        border-left:2px solid #6eb9ce;
        padding:8px 20px;
        color:#68797e;
        font:italic 18px/1.65 var(--serif)
      }
      .article-body h3 {
        font:500 23px/1.25 var(--serif);
        margin:1.7em 0 .55em
      }
      .article-tags {
        display:flex;
        flex-wrap:wrap;
        gap:7px;
        margin:18px 0 30px
      }
      .article-tags span,.article-tags a {
        border:1px solid #d8e5e8;
        padding:6px 9px;
        color:#68797e;
        font:8px var(--mono);
        letter-spacing:.06em;
        text-transform:uppercase
      }
      .article-body a {
        color:#43899b;
        text-decoration:underline
      }
      .article-bottom {
        border-top:1px solid #d8e5e8;
        padding-top:25px;
        margin-top:60px;
        display:flex;
        justify-content:space-between;
        font-size:11px
      }
      .article-engagement {
        margin-top:52px;
        padding:26px;
        background:#f0f7f8;
        border:1px solid #deeaec
      }
      .article-like-row {
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:16px;
        padding-bottom:22px;
        border-bottom:1px solid #d8e5e8
      }
      .article-like-row p,.comments-heading p {
        margin:5px 0 0;
        color:#75868b;
        font-size:11px
      }
      .article-like-button {
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:10px 14px;
        border:1px solid #bfd5da;
        border-radius:30px;
        background:#fff;
        color:#28393d;
        font:11px var(--sans);
        cursor:pointer
      }
      .article-like-button[aria-pressed="true"] {
        background:#d9eef3;
        border-color:#9ecdd8;
        color:#356f7d
      }
      .comments-section { padding-top:24px }
      .comments-heading {
        display:flex;
        align-items:end;
        justify-content:space-between;
        gap:16px;
        margin-bottom:16px
      }
      .comments-heading h2 {
        margin:0;
        font:500 25px/1.2 var(--serif)
      }
      .comment-list { display:grid; gap:10px }
      .comment-item {
        padding:14px 16px;
        background:#fff;
        border:1px solid #e3ecee
      }
      .comment-item header {
        display:flex;
        justify-content:space-between;
        gap:12px;
        color:#52676d;
        font:9px var(--mono);
        text-transform:uppercase
      }
      .comment-item p {
        margin:8px 0 0;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
        font-size:13px;
        line-height:1.7
      }
      .comment-empty { padding:16px; color:#829196; font-size:11px; background:#fff }
      .comment-form { display:grid; gap:12px; margin-top:20px }
      .comment-form h3 { margin:0; font:500 21px var(--serif) }
      .comment-form>p,.comment-form small { margin:0; color:#75868b; font-size:10px; line-height:1.6 }
      .comment-form label { display:grid; gap:6px; color:#62757a; font:9px var(--mono); letter-spacing:.06em }
      .comment-form input,.comment-form textarea {
        width:100%;
        padding:11px 12px;
        border:1px solid #d5e2e4;
        background:#fff;
        color:#172125;
        font:12px/1.6 var(--sans)
      }
      .comment-form textarea { min-height:110px; resize:vertical }
      .comment-form .comment-check {
        display:flex;
        align-items:flex-start;
        gap:8px;
        font:10px/1.5 var(--sans);
        letter-spacing:0;
        color:#52676d
      }
      .comment-check input { width:auto; margin:2px 0 0; accent-color:#68b4c4 }
      .comment-form .button { justify-self:start; cursor:pointer }
      .comment-message { min-height:16px; color:#477b65!important }
      .comment-error { color:#a24a4a!important }
      @media(max-width:600px) {
        .article-engagement { margin-top:36px; padding:17px 14px }
        .article-like-row { align-items:flex-start; flex-direction:column; gap:12px; padding-bottom:16px }
        .comments-heading { align-items:flex-start; flex-direction:column; gap:8px }
        .comments-heading h2 { font-size:23px }
        .comment-item { padding:12px }
        .article-bottom { gap:18px; align-items:flex-start; flex-wrap:wrap }
      }
      .article-not-found {
        text-align:center;
        padding:100px 20px
      }
      .article-not-found h1 {
        font-size:38px
      }
      .article-meta-top a {
        color:#68797e;
        text-decoration:underline;
        text-underline-offset:3px
      }
    </style>
