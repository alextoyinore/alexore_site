    <link rel="stylesheet" href="styles.css">
    <style>
      .article-wrap {
        width:min(760px,calc(100% - 40px));
        margin:85px auto 110px
      }
      .article-back {
        font-size:11px;
        border-bottom:1px solid #a6bdc2;
        padding-bottom:8px
      }
      .article-sample-note {
        margin:23px 0 18px;
        font:8px var(--mono);
        letter-spacing:.12em;
        color:#72878c
      }
      .article-hero {
        margin:0 0 35px;
        padding:40px;
        background:#d9eef3
        min-height:180px;
        position:relative;
        overflow:hidden
      }
      .article-hero:after {
        content:'✳';
        position:absolute;
        right:35px;
        top:4px;
        font-size:150px;
        color:#a4d7e3
      }
      .article-meta {
        font:9px var(--mono);
        letter-spacing:.1em;
        color:#68797e
      }
      .article-wrap h1 {
        font:500 clamp(42px,7vw,68px)/1.08 var(--serif);
        letter-spacing:-.04em;
        margin:23px 0
      }
      .article-deck {
        position:relative;
        max-width:690px;
        margin:26px 0 34px;
        padding:20px 25px 22px;
        background:#eaf4f6;
        border-left:2px solid #6eb9ce;
        color:#68797e;
        font:italic clamp(16px, 1rem + .3vw, 18px)/1.55 var(--serif)
      }
      .article-deck:before {
        content:"THE ESSENCE";
        display:block;
        margin:0 0 10px;
        color:#68797e;
        font:8px var(--mono);
        font-style:normal;
        letter-spacing:.16em
      }
      .article-body>p:first-child {
        margin-top:0
      }
      @media(max-width:600px) {
        .article-deck {
          margin:20px 0 27px;
          padding:17px 16px 18px;
          font-size:clamp(15.5px, 4vw, 17px);
          line-height:1.5
        }
        .article-deck:before {
          margin-bottom:8px
        }
      }
      .article-body {
        font:16px/1.9 var(--sans);
        color:#34454a
      }
      .article-body h2 {
        font:500 29px/1.2 var(--serif);
        margin:2em 0 .6em
      }
      .article-body blockquote {
        border-left:2px solid #6eb9ce;
        padding:8px 20px;
        color:#68797e;
        font:italic 18px/1.65 var(--serif)
      }
      .article-body h3 {
        font:500 23px/1.25 var(--serif);
        margin:1.7em 0 .55em
      }
      .article-tags {
        display:flex;
        flex-wrap:wrap;
        gap:7px;
        margin:18px 0 30px
      }
      .article-tags span,.article-tags a {
        border:1px solid #d8e5e8;
        padding:6px 9px;
        color:#68797e;
        font:8px var(--mono);
        letter-spacing:.06em;
        text-transform:uppercase
      }
      .article-body a {
        color:#43899b
        text-decoration:underline
      }
      .article-bottom {
        border-top:1px solid #d8e5e8;
        padding-top:25px;
        margin-top:60px;
        display:flex;
        justify-content:space-between;
        font-size:11px
      }
      .article-not-found {
        text-align:center;
        padding:100px 20px
      }
      .article-not-found h1 {
        font-size:38px
      }
      .article-meta-top a {
        color:#68797e;
        text-decoration:underline;
        text-underline-offset:3px
      }
    </style>
